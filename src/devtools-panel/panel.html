<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Response Mock</title>
  <link rel="stylesheet" href="panel.css">
  <link rel="stylesheet" href="vendor/vanilla-jsoneditor/themes/jse-theme-dark.css">
</head>
<body>
  <div class="panel-root">

    <!-- Header -->
    <header class="panel-header">
      <div class="header-left">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none">
          <path d="M12 2L2 7l10 5 10-5-10-5z" stroke="#4ec9b0" stroke-width="2" stroke-linejoin="round"/>
          <path d="M2 17l10 5 10-5" stroke="#4ec9b0" stroke-width="2" stroke-linejoin="round"/>
          <path d="M2 12l10 5 10-5" stroke="#4ec9b0" stroke-width="2" stroke-linejoin="round"/>
        </svg>
        <h1 class="panel-title">Response Mock</h1>
      </div>
      <div class="header-right">
        <label class="toggle-switch" title="总开关">
          <input type="checkbox" id="globalToggle" checked>
          <span class="toggle-slider"></span>
        </label>
        <button class="btn-icon" id="btnSettings" title="打开设置页面">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
        </svg>
        <input type="text" id="searchInput" placeholder="搜索规则名称、URL 或备注...">
      </div>
      <button class="btn btn-primary" id="btnAddRule">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M12 5v14M5 12h14"/>
        </svg>
        添加规则
      </button>
    </div>

    <!-- Rule List -->
    <div class="rule-list" id="ruleList">
      <!-- 动态渲染 -->
    </div>

    <!-- Empty State -->
    <div class="empty-state" id="emptyState" style="display:none;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/>
        <rect x="9" y="3" width="6" height="4" rx="1"/>
        <path d="M9 12h6M9 16h4"/>
      </svg>
      <p>暂无规则</p>
      <span>点击「添加规则」开始配置</span>
    </div>

    <!-- Status Bar -->
    <div class="status-bar">
      <span id="statusText">加载中...</span>
      <div class="status-actions">
        <button class="btn-link" id="btnExport">导出</button>
        <span class="divider">|</span>
        <button class="btn-link" id="btnImport">导入</button>
      </div>
    </div>

  </div>

  <!-- Add/Edit Rule Modal -->
  <div class="modal-overlay" id="ruleModal" style="display:none;">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modalTitle">添加规则</h2>
        <button class="btn-close" id="btnModalClose">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>规则名称 <span class="required">*</span></label>
          <input type="text" id="ruleName" placeholder="例如：Mock 用户信息">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>HTTP 方法</label>
            <select id="ruleMethod">
              <option value="*">全部</option>
              <option value="GET">GET</option>
              <option value="POST">POST</option>
              <option value="PUT">PUT</option>
              <option value="DELETE">DELETE</option>
              <option value="PATCH">PATCH</option>
              <option value="OPTIONS">OPTIONS</option>
              <option value="HEAD">HEAD</option>
            </select>
          </div>
          <div class="form-group">
            <label>响应状态码</label>
            <input type="number" id="ruleStatus" value="200" min="100" max="599">
          </div>
        </div>
        <div class="form-group">
          <label>URL 匹配规则 <span class="required">*</span></label>
          <input type="text" id="ruleUrl" placeholder="https://api.example.com/users/* 或 */api/user*">
          <small class="hint">支持 * 作为通配符匹配任意字符</small>
        </div>
        <div class="form-group">
          <label>响应延迟 (ms)</label>
          <input type="number" id="ruleDelay" value="0" min="0" max="30000" step="100">
          <small class="hint">设置响应延迟，用于模拟慢速网络或测试加载状态</small>
        </div>
        <div class="form-group">
          <label>响应头</label>
          <div class="headers-editor" id="headersEditor">
            <div class="header-row" data-index="0">
              <input type="text" class="header-key" placeholder="Header Name" value="Content-Type">
              <input type="text" class="header-val" placeholder="Header Value" value="application/json">
              <button class="btn-icon btn-remove-header" title="删除">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
              </button>
            </div>
          </div>
          <button class="btn btn-secondary btn-sm" id="btnAddHeader">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M12 5v14M5 12h14"/>
            </svg>
            添加响应头
          </button>
        </div>
        <div class="form-group">
          <label>响应体 (JSON) <span class="required">*</span></label>
          <div class="json-editor-container" id="jsonEditorContainer">
            <div class="json-search-wrap" id="jsonSearchWrap">
              <div class="json-search-bar">
                <div class="json-search-input-wrap">
                  <svg class="json-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
                  </svg>
                  <input type="text" id="jsonFieldSearch" placeholder="搜索字段名或值..." autocomplete="off" spellcheck="false">
                  <button class="json-search-clear" id="jsonSearchClear" style="display:none;" title="清除">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                  </button>
                </div>
                <span class="json-search-count" id="jsonSearchCount"></span>
                <button class="json-search-nav" id="jsonSearchPrev" title="上一个 (Shift+Enter)" disabled>
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <polyline points="18 15 12 9 6 15"/>
                  </svg>
                </button>
                <button class="json-search-nav" id="jsonSearchNext" title="下一个 (Enter)" disabled>
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <polyline points="6 9 12 15 18 9"/>
                  </svg>
                </button>
                <div class="json-search-dropdown" id="jsonSearchDropdown"></div>
              </div>
            </div>
            <div class="json-editor-shell jse-theme-dark" id="jsonEditorPanel"></div>
          </div>
        </div>
        <div class="form-group">
          <label>备注</label>
          <input type="text" id="ruleDescription" placeholder="可选，用于说明此规则的用途">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="btnCancelRule">取消</button>
        <button class="btn btn-primary" id="btnSaveRule">保存规则</button>
      </div>
    </div>
  </div>

  <!-- Confirm Delete Modal -->
  <div class="modal-overlay" id="deleteModal" style="display:none;">
    <div class="modal modal-sm">
      <div class="modal-header">
        <h2>确认删除</h2>
        <button class="btn-close" id="btnDeleteModalClose">&times;</button>
      </div>
      <div class="modal-body">
        <p>确定要删除规则「<strong id="deleteRuleName"></strong>」吗？</p>
        <p class="text-muted">此操作无法撤销。</p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="btnCancelDelete">取消</button>
        <button class="btn btn-danger" id="btnConfirmDelete">删除</button>
      </div>
    </div>
  </div>

  <!-- Hidden File Input for Import -->
  <input type="file" id="importFileInput" accept=".json" style="display:none;">

  <script src="panel.js" type="module"></script>
</body>
</html>
